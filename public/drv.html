<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Baxu Taksi · Haydovchi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#eef1f5;color:#14202e}
#top{position:sticky;top:0;z-index:50;background:#0c2f33;color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#top .b{font-size:18px;font-weight:800}#top .b i{color:#ff6a3d;font-style:normal}
#top .bal{text-align:right;font-size:12px;opacity:.9;line-height:1.3}#top .bal b{display:block;font-size:17px}
#app{padding:12px 12px 40px;max-width:520px;margin:0 auto}
.c{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;font-size:14.5px;line-height:1.5}
.c h3{margin:0 0 6px;font-size:16px}
.big{font-size:24px;font-weight:800}
.sub{color:#5b6b7e;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ad{margin:4px 0}.ad b{display:inline-block;width:20px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:#ff6a3d;color:#fff;margin-top:10px;text-align:center;text-decoration:none}
.btn.g{background:#43a047}.btn.l{background:#eef1f5;color:#14202e}.btn.r{background:#fde8e8;color:#c62828}.btn[disabled]{opacity:.5}
.btns{display:flex;gap:8px}.btns .btn{margin-top:8px}
.act{border:2px solid #43a047}
.new{border:2px solid #ff6a3d}
input{width:100%;border:1px solid #d5dce6;border-radius:12px;padding:12px;font-size:16px;margin:6px 0}
.tag{display:inline-block;background:#fff3cd;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700}
.tag.g{background:#d9f2df}
#toast{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:100;background:#14202ee6;color:#fff;border-radius:12px;padding:12px;font-size:14px;display:none}
#msg{position:fixed;inset:0;z-index:200;background:#eef1f5;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:17px;line-height:1.5}
.empty{text-align:center;color:#5b6b7e;padding:28px 10px}
</style></head><body>
<div id="top"><div class="b">Baxu<i>Taksi</i> · Haydovchi</div><div class="bal" id="bal"></div></div>
<div id="app"><div class="c empty">Yuklanmoqda...</div></div>
<div id="toast"></div><div id="msg"></div>
<script>
(function(){
'use strict';
var TW=window.Telegram&&Telegram.WebApp;try{TW&&(TW.ready(),TW.expand())}catch(e){}
var INIT=TW&&TW.initData||'';
var $=function(s){return document.querySelector(s)};
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function F(n){return String(Math.round(+n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function toast(t){var e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){e.style.display='none'},3500)}
function haptic(k){try{TW&&TW.HapticFeedback&&TW.HapticFeedback.notificationOccurred(k||'success')}catch(e){}}
function api(b){b.initData=INIT;return fetch('/api/driver',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json().then(function(j){if(!r.ok){j._s=r.status;throw j}return j})})}
if(!INIT){$('#msg').style.display='flex';$('#msg').textContent='Bu sahifani Telegramdagi bot ichidan oching (haydovchi ilovasi tugmasi).';return}

var ME=null,ORD=[],pos=null,known={},sure=0,busy=false,orderTimer=null,meTimer=null;
function hav(a,b){var r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r,x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)*Math.sin(dn/2);return 12742000*Math.asin(Math.sqrt(x))}
function fd(m){return m>=1000?(m/1000).toFixed(1).replace('.0','')+' km':Math.round(m/10)*10+' m'}
function ad(p){return p&&p.addr?esc(String(p.addr).slice(0,70)):'—'}
function ago(s){return s<20?'hozirgina':s<60?s+' soniya oldin':Math.floor(s/60)+' daq oldin'}

if(navigator.geolocation)try{navigator.geolocation.watchPosition(function(p){pos=[p.coords.latitude,p.coords.longitude]},function(){},{enableHighAccuracy:true,maximumAge:5000,timeout:20000})}catch(e){}

function head(){var b=$('#bal');b.innerHTML=ME&&ME.registered?'Balans<b>'+F(ME.balance)+' so‘m</b>🎁 bepul: '+ME.free:''}

function navRow(t,p){if(!p||p.lat==null||p.lng==null)return '';var ll=p.lat+','+p.lng;
 return '<div class="sub" style="margin-top:8px">'+t+'</div><div class="btns"><a class="btn l" data-x="https://yandex.com/maps/?rtext=~'+ll+'&rtt=auto" href="#">Yandex</a><a class="btn l" data-x="https://www.google.com/maps/dir/?api=1&destination='+ll+'&travelmode=driving" href="#">Google</a></div>'}
function picked(id){try{return localStorage.getItem('pk_'+id)==='1'}catch(e){return false}}
function navBig(a){var pk=picked(a.id),p=pk?a.to:a.from;if(!p||p.lat==null||p.lng==null)return '<a class="btn" href="/driver.html?o='+esc(a.id)+'">🧭 Navigatsiya (xarita)</a>';
 var ll=p.lat+','+p.lng,y='https://yandex.com/maps/?rtext=~'+ll+'&rtt=auto',g='https://www.google.com/maps/dir/?api=1&destination='+ll+'&travelmode=driving';
 return '<a class="btn" data-x="'+y+'" href="#">'+(pk?'🏁 Manzilga':'🧭 Yo‘lovchi oldiga')+'</a>'+
  '<div class="sub" style="text-align:center;margin:6px 0">Yandex ochiladi · <a data-x="'+g+'" href="#">Google</a> · <a href="/driver.html?o='+esc(a.id)+'">ilova xaritasi</a></div>'+
  (pk?'':'<button class="btn g" id="pk">✅ Yo‘lovchi o‘tirdi</button>')}
function render(){head();var h='';
 if(!ME){return}
 if(!ME.registered){
  h+='<div class="c"><h3>🚕 Haydovchi bo‘lish</h3><div class="sub">Komissiya atigi <b>'+ME.cfg.feePct+'%</b>, dastlabki <b>'+ME.cfg.freeOrders+'</b> ta buyurtma komissiyasiz.</div>'+
     '<div style="margin-top:10px"><b>Ism va familiya</b><input id="fn" maxlength="40" placeholder="Masalan: Aziz Karimov" autocomplete="name" value="'+esc(ME.name||'')+'"></div>'+
     '<div style="margin-top:6px"><b>Telefon raqam</b><input id="fp" type="tel" inputmode="tel" maxlength="19" placeholder="+998 90 123 45 67" autocomplete="tel" value="'+esc(fphone(ME.phone))+'"></div>'+
     '<div style="margin-top:10px"><b>Mashinangiz</b><div class="sub">Markasi, rangi va davlat raqami. Yo‘lovchi sizni shu bo‘yicha taniydi.</div><input id="car" maxlength="60" placeholder="Cobalt, oq, 01 A 123 BC" autocomplete="off"></div>'+
     '<button class="btn" id="reg">Boshlash</button></div>';
  $('#app').innerHTML=h;$('#reg').onclick=register;var fpi=$('#fp');fpi.addEventListener('input',function(){this.value=fphone(this.value)});if(ME.car&&$('#car'))$('#car').value=ME.car;return}
 if(ME.blocked){$('#app').innerHTML='<div class="c"><h3>⛔ Hisobingiz bloklangan</h3>Admin bilan bog‘laning.</div>';return}
 var a=ME.active;
 if(!a){h+='<div class="c"><div class="row"><b>'+(ME.online?'🟢 Liniyadasiz':'⚫ Liniyada emassiz')+'</b></div><div class="sub">'+(ME.online?'Yangi buyurtma xabari botga keladi. Buyurtmani tugatgach ham liniyada qolasiz.':'Yangi buyurtma xabari kelishi uchun liniyaga chiqing.')+'</div><button class="btn '+(ME.online?'l':'g')+'" id="ol">'+(ME.online?'Liniyadan chiqish':'🟢 Liniyaga chiqish')+'</button></div>'}
 if(a){h+='<div class="c act"><div class="row"><h3>🚕 Joriy buyurtma #'+esc(a.id)+'</h3><span class="tag g">Faol</span></div>'+
   '<div class="big">'+F(a.price)+' so‘m</div><div class="sub">Komissiya '+F(a.fee)+' · ~'+esc(a.km)+' km</div>'+
   '<div class="ad"><b>📍</b>'+ad(a.from)+'</div><div class="ad"><b>🏁</b>'+ad(a.to)+'</div>'+
   navBig(a)+
   '<div class="btns"><a class="btn l" href="tel:+998'+esc(String(a.phone).replace(/\D/g,''))+'">📞 '+esc(a.pname||'Yo‘lovchi')+'</a>'+
   (a.canCancel?'<button class="btn r" id="cx">'+(sure?'Ha, bekor':'❌ Bekor')+'</button>':'')+'</div>'+
   '<button class="btn g" id="dn">🏁 Safar tugadi</button></div>'}
 h+='<div class="row" style="margin:6px 4px"><b>Yangi buyurtmalar</b><span class="sub">har 4 soniyada yangilanadi</span></div>';
 var list=ORD.slice();
 if(pos)list.forEach(function(o){o.d=o.from&&o.from.lat?hav(pos,[o.from.lat,o.from.lng]):1e9});
 if(pos)list.sort(function(x,y){return x.d-y.d});
 if(!list.length)h+='<div class="c empty">Hozircha yangi buyurtma yo‘q.<br>Ilovani ochiq qoldiring, yangi buyurtma kelsa, xabar beramiz.</div>';
 list.forEach(function(o){h+='<div class="c new"><div class="row"><span class="big">'+F(o.price)+' so‘m</span><span class="sub">'+ago(o.age)+'</span></div>'+
   '<div class="sub">'+(o.fee?'Komissiya '+F(o.fee)+' · sizga '+F(o.price-o.fee):'🎁 Komissiyasiz · sizga '+F(o.price))+'</div>'+
   '<div class="ad"><b>📍</b>'+ad(o.from)+(o.d!=null&&o.d<1e8?' <span class="tag">sizdan '+fd(o.d)+'</span>':'')+'</div><div class="ad"><b>🏁</b>'+ad(o.to)+'</div><div class="sub">📏 ~'+esc(o.km)+' km</div>'+
   '<button class="btn" data-a="'+esc(o.id)+'"'+(a?' disabled':'')+'>'+(a?'Avval joriy buyurtmani tugating':'✅ Qabul qilaman')+'</button></div>'});
 h+='<div class="c"><h3>🚗 Mashinam</h3><div class="sub">'+esc(ME.car||'kiritilmagan')+'</div><div id="ce" style="display:none"><input id="car" maxlength="60" value="'+esc(ME.car||'')+'"><button class="btn" id="cs">Saqlash</button></div><button class="btn l" id="cb">O‘zgartirish</button></div>';
 h+='<div class="c"><h3>💰 Balans</h3>'+F(ME.balance)+' so‘m · bepul buyurtma: '+ME.free+'<div class="sub" style="margin-top:6px">'+(ME.cfg.test?'Sinov rejimi: balansni admin to‘ldiradi.':'To‘ldirish: botga o‘ting va «➕ To‘ldirish» ni bosing.')+'</div></div>';
 var keep=$('#car')&&$('#ce')&&$('#ce').style.display!=='none'?$('#car').value:null;
 $('#app').innerHTML=h;
 if(keep!=null){$('#ce').style.display='block';$('#cb').style.display='none';$('#car').value=keep}
 bind()}

function bind(){
 document.querySelectorAll('[data-a]').forEach(function(b){b.onclick=function(){accept(b.getAttribute('data-a'),b)}});
 var cx=$('#cx');if(cx)cx.onclick=cancel;var dn=$('#dn');if(dn)dn.onclick=done;var pk=$('#pk');if(pk)pk.onclick=function(){try{localStorage.setItem('pk_'+ME.active.id,'1')}catch(e){}haptic();render()};
 document.querySelectorAll('[data-x]').forEach(function(x){x.onclick=function(ev){ev.preventDefault();var u=x.getAttribute('data-x');try{if(TW&&TW.openLink){TW.openLink(u);return}}catch(e){}window.open(u,'_blank')}});
 var ol=$('#ol');if(ol)ol.onclick=function(){var b=this;b.disabled=true;api({action:'online',on:!ME.online}).then(function(r){ME.online=r.online;haptic();toast(r.online?'🟢 Liniyadasiz':'Liniyadan chiqdingiz');render()}).catch(function(e){b.disabled=false;toast(e&&e.error||'Xatolik')})};
 $('#cb').onclick=function(){$('#ce').style.display='block';this.style.display='none'};
 $('#cs').onclick=function(){api({action:'car',car:$('#car').value}).then(function(){toast('✅ Saqlandi');$('#ce').style.display='none';loadMe()}).catch(function(e){toast(e&&e.error||'Xatolik')})}}

function fphone(v){var d=String(v||'').replace(/\D/g,'');if(d.indexOf('998')===0)d=d.slice(3);d=d.slice(0,9);var o='+998';if(d)o+=' '+d.slice(0,2);if(d.length>2)o+=' '+d.slice(2,5);if(d.length>5)o+=' '+d.slice(5,7);if(d.length>7)o+=' '+d.slice(7,9);return d?o:''}
function register(){var b=$('#reg');b.disabled=true;api({action:'register',name:$('#fn').value,phone:$('#fp').value,car:$('#car').value}).then(function(){haptic();return loadMe()}).then(function(){return loadOrders()}).catch(function(e){b.disabled=false;toast(e&&e.error||'Xatolik')})}
function accept(id,btn){if(busy)return;busy=true;btn.disabled=true;
 api({action:'accept',id:id}).then(function(r){busy=false;haptic();toast('✅ Buyurtma sizniki!'+(r.free?' 🎁 Bepul':' Komissiya '+F(r.fee)+' so‘m yechildi'));ORD=ORD.filter(function(o){return o.id!==id});loadMe().then(function(){if(ME&&ME.active)location.href='/driver.html?o='+encodeURIComponent(id)})})
 .catch(function(e){busy=false;btn.disabled=false;haptic('error');toast(e&&e.error||'Xatolik');loadOrders();loadMe()})}
function cancel(){if(!sure){sure=1;render();setTimeout(function(){sure=0;render()},4000);return}
 sure=0;api({action:'cancel',id:ME.active.id}).then(function(r){toast('Bekor qilindi'+(r.refund?'. Komissiya qaytarildi':''));loadMe();loadOrders()}).catch(function(e){toast(e&&e.error||'Xatolik');loadMe()})}
function done(){var b=this;b.disabled=true;api({action:'done',id:ME.active.id}).then(function(){haptic();toast('Rahmat! Safar yakunlandi 🏁');loadMe();loadOrders()}).catch(function(e){b.disabled=false;toast(e&&e.error||'Xatolik');loadMe()})}

function loadMe(){return api({action:'me'}).then(function(j){ME=j;if(!document.activeElement||document.activeElement.tagName!=='INPUT')render();else head()}).catch(function(e){if(e&&e._s===401){$('#msg').style.display='flex';$('#msg').textContent='Telegram orqali oching.'}})}
function loadOrders(){if(!ME||!ME.registered||ME.blocked)return;return api({action:'orders'}).then(function(j){
 var fresh=j.orders.filter(function(o){return !known[o.id]});j.orders.forEach(function(o){known[o.id]=1});
 var first=Object.keys(known).length===j.orders.length&&!window.__seen;window.__seen=1;
 if(fresh.length&&!first){haptic();toast('🆕 Yangi buyurtma: '+F(fresh[0].price)+' so‘m')}
 ORD=j.orders;if(ME){ME.balance=j.balance;ME.free=j.free}
 if(!document.activeElement||document.activeElement.tagName!=='INPUT')render()}).catch(function(){})}

var IDLE=120000,lastAct=Date.now(),idle=false,idleT=null;
function startT(){stopT();orderTimer=setInterval(loadOrders,8000);meTimer=setInterval(loadMe,20000);idleT=setInterval(function(){if(!idle&&Date.now()-lastAct>IDLE){idle=true;stopT();clearInterval(idleT)}},10000)}
function stopT(){clearInterval(orderTimer);clearInterval(meTimer);clearInterval(idleT)}
function act(){lastAct=Date.now();if(idle&&!document.hidden){idle=false;loadMe();loadOrders();startT()}}
['touchstart','click','scroll','keydown','mousemove'].forEach(function(ev){document.addEventListener(ev,act,{passive:true})});
loadMe().then(function(){loadOrders();if(!document.hidden)startT()});
document.addEventListener('visibilitychange',function(){if(document.hidden){stopT()}else{lastAct=Date.now();idle=false;loadMe();loadOrders();startT()}});
})();
</script></body></html>
