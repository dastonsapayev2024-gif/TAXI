<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Baxu Taksi · Admin</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#eef1f5;color:#14202e}
#tabs{position:fixed;top:0;left:0;right:0;z-index:1500;background:#0c2f33;display:flex;padding-top:env(safe-area-inset-top,0px)}
#tabs button{flex:1;border:0;background:none;color:#9fc3c7;padding:12px 2px;font-size:13px;font-weight:700;border-bottom:3px solid transparent}
#tabs button.on{color:#fff;border-bottom-color:#ff6a3d}
.pane{position:fixed;left:0;right:0;bottom:0;top:calc(46px + env(safe-area-inset-top,0px));overflow:auto;display:none;padding:12px}
.pane.on{display:block}
#pm{padding:0}#map{position:absolute;inset:0}
#mi{position:absolute;left:8px;right:8px;bottom:8px;z-index:1000;background:#fff;border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.5;box-shadow:0 4px 16px rgba(0,0,0,.2);max-height:34%;overflow:auto}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{background:#fff;border-radius:14px;padding:12px}.k small{display:block;color:#5b6b7e;font-size:12px}.k b{font-size:20px}.k.w{grid-column:1/3}
.c{background:#fff;border-radius:14px;padding:11px 12px;margin-bottom:8px;font-size:14px;line-height:1.5}
.c .t{display:flex;justify-content:space-between;gap:8px;font-weight:700}.c small{color:#5b6b7e}
.bt{border:0;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;background:#eef1f5;color:#14202e;margin:6px 6px 0 0}
.bt.o{background:#ff6a3d;color:#fff}.bt.r{background:#fde8e8;color:#c62828}
.st{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700}
.s-new{background:#fff3cd}.s-taken{background:#d9f2df}.s-done{background:#e3e9f5}.s-cancelled,.s-expired{background:#fde8e8}
#msg{position:fixed;inset:0;z-index:3000;background:#eef1f5;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:17px;line-height:1.5}
#toast{position:fixed;left:12px;right:12px;bottom:18px;z-index:2500;background:#14202ee6;color:#fff;border-radius:12px;padding:12px;font-size:14px;display:none}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}.pin span{display:block;transform:rotate(45deg);color:#fff;font-weight:800;font-size:11px;text-align:center;line-height:22px}
.car{width:30px;height:30px;border-radius:50%;background:#ff6a3d;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:16px}
input{width:100%;border:1px solid #d5dce6;border-radius:10px;padding:10px;font-size:15px;margin:4px 0}
</style></head><body>
<div id="tabs"><button data-p="pm" class="on">🗺 Xarita</button><button data-p="ps">📊 Statistika</button><button data-p="pd">🚕 Haydovchilar</button><button data-p="po">📋 Buyurtmalar</button></div>
<div class="pane on" id="pm"><div id="map"></div><div id="mi">Yuklanmoqda...</div></div>
<div class="pane" id="ps"></div>
<div class="pane" id="pd"></div>
<div class="pane" id="po"></div>
<div id="amt" style="display:none;position:fixed;inset:0;z-index:2800;background:#0008;align-items:center;justify-content:center;padding:20px"><div style="background:#fff;border-radius:16px;padding:16px;width:100%;max-width:340px"><b>Balansga summa</b><br><small style="color:#5b6b7e">So‘m. Minus ham bo‘ladi (masalan -10000)</small><input id="amv" type="number" inputmode="numeric" placeholder="50000"><button class="bt o" id="amo">Qo‘shish</button><button class="bt" id="amx">Bekor</button></div></div>
<div id="msg"></div><div id="toast"></div>
<script>
(function(){
'use strict';
var TW=window.Telegram&&Telegram.WebApp;try{TW&&(TW.ready(),TW.expand())}catch(e){}
var INIT=TW&&TW.initData||'';
var $=function(s){return document.querySelector(s)};
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function F(n){return String(Math.round(+n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function fatal(t){var m=$('#msg');m.style.display='flex';m.textContent=t}
function toast(t){var e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){e.style.display='none'},3000)}
function api(b){b.initData=INIT;return fetch('/api/admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json().then(function(j){if(r.status===403){fatal('Bu sahifa faqat admin uchun.');throw 0}if(!r.ok)throw j;return j})})}
if(!INIT)return fatal('Bu sahifani botdagi /panel tugmasi orqali oching.');

var ST={new:'🆕 Yangi',taken:'🚕 Yo‘lda',done:'🏁 Tugadi',cancelled:'❌ Bekor',expired:'⌛ Muddati o‘tdi'};
function stb(s){return '<span class="st s-'+esc(s)+'">'+(ST[s]||esc(s))+'</span>'}
function ad(p){return p&&p.addr?esc(String(p.addr).slice(0,60)):'—'}

var cur='pm',timer=null;
document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){go(b.getAttribute('data-p'))}});
function go(p){cur=p;document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-p')===p)});document.querySelectorAll('.pane').forEach(function(x){x.classList.toggle('on',x.id===p)});load();if(p==='pm'&&window.__map)setTimeout(function(){__map.invalidateSize()},100)}
function load(){clearInterval(timer);({pm:live,ps:stats,pd:drivers,po:orders})[cur]();if(cur==='pm'||cur==='ps')timer=setInterval(function(){({pm:live,ps:stats})[cur]()},6000)}

// ---- xarita ----
var map=L.map('map',{zoomControl:true}).setView([41.3111,69.2797],12);window.__map=map;
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
var layer=L.layerGroup().addTo(map),fitted=false;
function pin(c,t){return L.divIcon({className:'',html:'<div class="pin" style="background:'+c+'"><span>'+t+'</span></div>',iconSize:[26,26],iconAnchor:[13,26]})}
function live(){api({action:'live'}).then(function(j){
 layer.clearLayers();var pts=[],h='';
 j.orders.forEach(function(o){var f=o.fromp,t=o.top;
  if(f&&f.lat){var m=L.marker([f.lat,f.lng],{icon:pin(o.status==='new'?'#ff9800':'#2e9e4f','A')}).addTo(layer);pts.push([f.lat,f.lng])}
  if(o.status==='taken'&&o.dlat!=null&&o.dage!=null&&o.dage<120){L.marker([o.dlat,o.dlng],{icon:L.divIcon({className:'',html:'<div class="car">🚕</div>',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(layer);pts.push([o.dlat,o.dlng])}
  h+='<div style="margin-bottom:6px"><b>#'+esc(o.id)+'</b> '+stb(o.status)+' · '+F(o.price)+' so‘m<br><small>📍 '+ad(f)+' → '+ad(t)+(o.dn?'<br>🚗 '+esc(o.dn)+' '+esc(o.dc||''):'')+'</small></div>'});
 $('#mi').innerHTML=h||'Hozir faol buyurtma yo‘q.';
 if(!fitted&&pts.length){fitted=true;try{map.fitBounds(L.latLngBounds(pts),{padding:[40,40],maxZoom:15})}catch(e){}}
}).catch(function(){})}

// ---- statistika ----
function stats(){api({action:'stats'}).then(function(j){var o=j.orders,d=j.drivers,t=j.pendingTopups;
 $('#ps').innerHTML='<div class="g">'+
 '<div class="k w"><small>💼 Bugungi komissiya</small><b>'+F(o.fee_today)+' so‘m</b></div>'+
 '<div class="k"><small>Shu oy</small><b>'+F(o.fee_month)+'</b></div><div class="k"><small>Jami komissiya</small><b>'+F(o.fee_all)+'</b></div>'+
 '<div class="k"><small>Bugun buyurtma</small><b>'+o.today+'</b></div><div class="k"><small>Yangi (kutmoqda)</small><b>'+o.open+'</b></div>'+
 '<div class="k"><small>Yo‘lda</small><b>'+o.taken+'</b></div><div class="k"><small>Bajarilgan</small><b>'+o.done+'</b></div>'+
 '<div class="k"><small>Bekor qilingan</small><b>'+o.cancelled+'</b></div><div class="k"><small>Muddati o‘tgan</small><b>'+o.expired+'</b></div>'+
 '<div class="k w"><small>Haydovchilar balansi jami (sizda ushlab turiladi)</small><b>'+F(d.bal)+' so‘m</b></div>'+
 '<div class="k"><small>Haydovchilar</small><b>'+d.n+'</b></div><div class="k"><small>Bloklangan</small><b>'+d.blocked+'</b></div>'+
 '<div class="k w"><small>Buyurtmalar aylanmasi (yo‘lovchi to‘lovlari, sizga tegmaydi)</small><b>'+F(o.turnover)+' so‘m</b></div>'+
 (t.n?'<div class="k w"><small>⏳ Tasdiqlanmagan to‘ldirishlar</small><b>'+t.n+' ta · '+F(t.s)+' so‘m</b></div>':'')+'</div>'}).catch(function(){})}

// ---- haydovchilar ----
function drivers(){api({action:'drivers'}).then(function(j){var h='';
 j.drivers.forEach(function(d){h+='<div class="c"><div class="t"><span>'+esc(d.name||'Haydovchi')+(d.username?' <small>@'+esc(d.username)+'</small>':'')+'</span><span>'+(d.blocked?'⛔':'✅')+'</span></div>'+
 '<small>ID <code>'+esc(d.tg_id)+'</code> · 🚗 '+esc(d.car||'kiritilmagan')+'</small><br>💰 Balans: <b>'+F(d.balance)+'</b> so‘m · 🎁 bepul: '+d.free_left+
 '<div><button class="bt o" data-a="add" data-i="'+esc(d.tg_id)+'">➕ Balans</button><button class="bt '+(d.blocked?'':'r')+'" data-a="'+(d.blocked?'unblock':'block')+'" data-i="'+esc(d.tg_id)+'">'+(d.blocked?'Blokdan chiqarish':'⛔ Bloklash')+'</button></div></div>'});
 $('#pd').innerHTML=h||'<div class="c">Hali haydovchi yo‘q. Haydovchi botga /start driver yozsa, shu yerda chiqadi.</div>'}).catch(function(){})}
$('#pd').onclick=function(e){var b=e.target.closest('button');if(!b)return;var a=b.getAttribute('data-a'),i=b.getAttribute('data-i');
 if(a==='add'){ask(i);return}
 else api({action:a,driver:i}).then(function(){toast(a==='block'?'⛔ Bloklandi':'✅ Blok olindi');drivers()}).catch(function(x){toast(x&&x.error||'Xatolik')})};

function ask(i){var m=$('#amt');m.style.display='flex';m.setAttribute('data-i',i);$('#amv').value='';setTimeout(function(){$('#amv').focus()},50)}
$('#amx').onclick=function(){$('#amt').style.display='none'};
$('#amo').onclick=function(){var i=$('#amt').getAttribute('data-i'),n=Math.trunc(Number(String($('#amv').value).replace(/\s/g,'')));if(!n||Math.abs(n)>5000000)return toast('Summa noto‘g‘ri');
 api({action:'add',driver:i,amount:n}).then(function(r){$('#amt').style.display='none';toast('✅ Yangi balans: '+F(r.balance)+' so‘m');drivers()}).catch(function(x){toast(x&&x.error||'Xatolik')})};

// ---- buyurtmalar ----
function orders(){api({action:'orders'}).then(function(j){var h='';
 j.orders.forEach(function(o){var d=new Date(o.created);h+='<div class="c"><div class="t"><span>#'+esc(o.id)+' '+stb(o.status)+'</span><span>'+F(o.price)+' so‘m</span></div>'+
 '<small>'+esc(('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2))+' · ~'+esc(o.km)+' km'+(o.dn?' · 🚗 '+esc(o.dn):'')+(+o.fee_paid?' · 💼 '+F(o.fee_paid):'')+'</small><br>📍 '+ad(o.fromp)+'<br>🏁 '+ad(o.top)+'</div>'});
 $('#po').innerHTML=h||'<div class="c">Hali buyurtma yo‘q.</div>'}).catch(function(){})}

load();
})();
</script></body></html>
